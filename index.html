<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartment Cash Log</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#2563eb">
</head>

<body>
    <header>
        <div class="header-container">
            <h1>🏢 Apartment Cash Log</h1>
            <button id="install-btn" class="hidden">📲 Install App</button>
        </div>
    </header>

    <main>
        <!-- Summary Card -->
        <section class="card summary-card">
            <div class="summary-label">Total Logged</div>
            <div id="total-amount" class="summary-value">₹0</div>
        </section>

        <!-- Expense Entry Form -->
        <section class="card">
            <h2>Record Expense</h2>
            <form id="expense-form">
                <div class="form-group">
                    <label for="amount">Amount (₹) *</label>
                    <input type="number" id="amount" placeholder="e.g. 1500" required min="1" step="any">
                </div>

                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" required>
                        <option value="Water Tanker">Water Tanker</option>
                        <option value="Electricity (Common)">EB Common Bill</option>
                        <option value="Security Guard">Security Guard</option>
                        <option value="Cleaning / Waste">Cleaning / Waste</option>
                        <option value="Plumbing / Electrical">Plumbing / Repairs</option>
                        <option value="Lift AMC">Lift AMC</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="payer">Flat / Paid By</label>
                    <input type="text" id="payer" placeholder="e.g. F-3, Association Fund">
                </div>

                <div class="form-group">
                    <label for="note">Note / Receipt Ref</label>
                    <input type="text" id="note" placeholder="e.g. 5000L Metro Water">
                </div>

                <button type="submit" class="primary-btn">Save Expense</button>
            </form>
        </section>

        <!-- Expenses List -->
        <section class="card">
            <div class="list-header">
                <h2>Recent Transactions</h2>
                <button id="clear-btn" class="text-btn">Clear All</button>
            </div>
            <ul id="expense-list" class="expense-list"></ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
